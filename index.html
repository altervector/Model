<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Can Bellés | Cuina tradicional catalana</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Módulo reutilizable: Header -->
  <div id="header"></div>

  <!-- Módulo reutilizable: Hero -->
  <div id="hero"></div>

  <!-- Módulo reutilizable: Sección de información -->
  <div id="info-section"></div>

  <!-- Módulo reutilizable: Footer -->
  <div id="footer"></div>

  <script>
    // Carga dinámica de módulos HTML (para reutilizar en varios proyectos)
    function loadComponent(id, file) {
      fetch(`components/${file}`)
        .then(response => response.text())
        .then(data => document.getElementById(id).innerHTML = data);
    }
    loadComponent('header', 'header.html');
    loadComponent('hero', 'hero.html');
    loadComponent('info-section', 'info-section.html');
    loadComponent('footer', 'footer.html');
  </script>
</body>
</html>
